<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prompt It.</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HOME -->

    <main class="home" id="homeScreen">

        <h1>Prompt It.</h1>

        <p>Build better AI prompts, one step at a time.</p>

        <button id="startButton">START</button>

    </main>


    <!-- STEP 1 -->

    <main class="step-screen" id="stepOne" style="display: none;">

        <h2>What do you want AI to do?</h2>

        <div class="options">

            <button class="option" data-action="Explain">
                Explain
            </button>

            <button class="option" data-action="Elaborate">
                Elaborate
            </button>

            <button class="option" data-action="Describe">
                Describe
            </button>

            <button class="option" data-action="Help me study">
                Help me study
            </button>

            <button class="option" data-action="Focus on">
                Focus on
            </button>

            <button class="option" data-action="Compare">
                Compare
            </button>

            <button class="option" data-action="Break down">
                Break down
            </button>

        </div>

    </main>


    <!-- STEP 2 -->

    <main class="step-screen" id="stepTwo" style="display: none;">

        <h2 id="stepTwoQuestion"></h2>

        <div class="options" id="stepTwoOptions"></div>

    </main>

    <!-- MATERIAL INPUT -->

    <main class="step-screen" id="materialStep" style="display: none;">

        <h2 id="materialQuestion"></h2>

        <div id="materialInputs"></div>

        <button id="materialNext">NEXT →</button>

    </main>
    <!-- WHY -->

<main class="step-screen" id="whyStep" style="display: none;">

    <h2>Why do you need this?</h2>

    <div class="options" id="whyOptions">

        <button class="option" data-purpose="For a test">
            For a test
        </button>

        <button class="option" data-purpose="For an assignment">
            For an assignment
        </button>

        <button class="option" data-purpose="For a discussion">
            For a discussion
        </button>

        <button class="option" data-purpose="For a study guide">
            For a study guide
        </button>

        <button class="option" data-purpose="For flashcards">
            For flashcards
        </button>

        <button class="option" data-purpose="Just to understand it">
            Just to understand it
        </button>

    </div>

    <button id="skipWhy">SKIP →</button>

</main>
    
    <!-- HOW -->

<main class="step-screen" id="howStep" style="display: none;">

    <h2>How should AI respond?</h2>

    <div class="options" id="howOptions">

        <button class="option" data-style="Explain simply">
            Explain simply
        </button>

        <button class="option" data-style="Give me a detailed explanation">
            Give me a detailed explanation
        </button>

        <button class="option" data-style="Use bullet points">
            Use bullet points
        </button>

        <button class="option" data-style="Give me examples">
            Give me examples
        </button>

        <button class="option" data-style="Walk me through it step-by-step">
            Walk me through it step-by-step
        </button>

        <button class="option" data-style="Ask me questions">
            Ask me questions
        </button>

    </div>

    <button id="skipHow">SKIP →</button>

</main>


    <script src="script.js"></script>

</body>

</html>
