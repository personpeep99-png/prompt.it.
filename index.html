<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prompt It.</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="home" id="homeScreen">

        <h1>Prompt It.</h1>

        <p>Build better AI prompts, one step at a time.</p>

        <button id="startButton">START</button>

    </main>


    <main class="step-screen" id="stepOne" style="display: none;">

        <h2>What do you want AI to do?</h2>

        <div class="options">

            <button class="option">Explain</button>

            <button class="option">Elaborate</button>

            <button class="option">Describe</button>

            <button class="option">Help me study</button>

            <button class="option">Focus on</button>

            <button class="option">Compare</button>

            <button class="option">Break down</button>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
